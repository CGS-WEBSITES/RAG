name: pgai

services:
  db:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    environment:
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_MAX_LOADED_MODELS: "2"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  vectorizer-worker:
    image: timescale/pgai-vectorizer-worker:latest
    environment:
      PGAI_VECTORIZER_WORKER_DB_URL: postgres://postgres:postgres@db:5432/postgres
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    command: ["--poll-interval", "5s"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    entrypoint: ["bash", "./entrypoint.sh"]
    ports:
      - "5001:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      LLM_MODEL: ${LLM_MODEL:-}
      INTERNAL_ACCESS_CODE: ${INTERNAL_ACCESS_CODE:-}
      INTERNAL_USERS: ${INTERNAL_USERS:-}
      INTERNAL_GUEST: ${INTERNAL_GUEST:-}
      FRESHDESK_API_KEY: ${FRESHDESK_API_KEY:-}
      FRESHDESK_SYNC_MINUTES: ${FRESHDESK_SYNC_MINUTES:-10}
      INTERNAL_LLM_MODEL: ${INTERNAL_LLM_MODEL:-}
      INTERNAL_FALLBACK_MODELS: ${INTERNAL_FALLBACK_MODELS:-}
      REVIEW_LABEL: ${REVIEW_LABEL:-}
      REVIEW_NAME: ${REVIEW_NAME:-}
      REVIEW_AGENTS: ${REVIEW_AGENTS:-}
      REVIEW_UNTIL: ${REVIEW_UNTIL:-}
      REVIEW_OTHERS: ${REVIEW_OTHERS:-}
      CLAUDE_EFFORT: ${CLAUDE_EFFORT:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      POLLY_IDENTITY_POOL_ID: ${POLLY_IDENTITY_POOL_ID:-}
      PUBLIC_DAILY_QUESTIONS: ${PUBLIC_DAILY_QUESTIONS:-}
      PUBLIC_HOURLY_PER_IP: ${PUBLIC_HOURLY_PER_IP:-}
      PUBLIC_LLM_MODEL: ${PUBLIC_LLM_MODEL:-}
      PUBLIC_CLAUDE_EFFORT: ${PUBLIC_CLAUDE_EFFORT:-}
      VOICE_DAILY_CHARS: ${VOICE_DAILY_CHARS:-}
      FRESHDESK_URL: ${FRESHDESK_URL:-https://wearecgs.freshdesk.com}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      - ./entrypoint.sh:/app/entrypoint.sh:ro
      - ./scripts:/app/scripts
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  data:
  ollama_data: